name: Build APK — 똑똑 생활왕

on:
  push:
    branches: [ main, 'copilot/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddokddok-saengwalwang-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release and upload APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 똑똑 생활왕 v${{ github.run_number }}
          body: |
            ## 똑똑 생활왕 👑 APK 다운로드

            아래 APK 파일을 다운로드하여 Android 기기에 설치하세요.

            ### 설치 방법
            1. 아래 `app-debug.apk` 파일을 다운로드
            2. Android 설정 → 보안 → **알 수 없는 출처 설치 허용**
            3. 다운로드한 APK 파일 실행하여 설치
            4. 홈 화면에서 **똑똑 생활왕** 아이콘 탭하여 실행!

            ### QR코드로 다운로드
            ![QR코드](https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com/Lucuze/testgame1/releases/latest/download/app-debug.apk)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
